services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: nwis-postgres
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis_user
      POSTGRES_PASSWORD: nwis_dev_password
    ports:
      - '5433:5432'
    volumes:
      - nwis_pgdata:/var/lib/postgresql/data
      - ./backend/src/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nwis_user -d nwis']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nwis_pgdata:
